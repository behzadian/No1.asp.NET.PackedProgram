name: Build api

on:
  push:
    branches-ignore: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
        
    - name: Restore dependencies
      run: dotnet restore Farabank.slnx
      env:
        HUSKY: 0
    
    - name: Check vulnerable packages
      run: find . -name "*.csproj" -exec dotnet list {} package --vulnerable --include-transitive \;
    
    - name: Check code style
      run: dotnet format --verify-no-changes --verbosity diagnostic --severity error  Farabank.slnx

    - name: Build
      run: dotnet build --no-restore Farabank.slnx

    - name: Test
      run: dotnet test --no-build --verbosity normal Farabank.slnx
